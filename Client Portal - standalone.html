  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eShared view · read-only\\u003c/span\\u003e\\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv class=\\\"board-head\\\"\\u003e\\n    \\u003ch1\\u003eVMS Configuration &amp; Implementation — Liander\\u003c/h1\\u003e\\n    \\u003cdiv class=\\\"sub\\\"\\u003eProject plan managed by Customer Success · powered by AI · last updated 11 Jun 2026\\u003c/div\\u003e\\n  \\u003c/div\\u003e\\n  \\u003cdiv class=\\\"views\\\"\\u003e\\n    \\u003cdiv class=\\\"view active\\\"\\u003eMain Table\\u003c/div\\u003e\\n    \\u003cdiv class=\\\"view\\\"\\u003eTimeline\\u003c/div\\u003e\\n    \\u003cdiv class=\\\"view\\\"\\u003eKanban\\u003c/div\\u003e\\n    \\u003cdiv class=\\\"view\\\"\\u003eGantt\\u003c/div\\u003e\\n    \\u003cdiv class=\\\"view\\\"\\u003eDashboard\\u003c/div\\u003e\\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv class=\\\"board\\\" id=\\\"board\\\"\\u003e\\u003c/div\\u003e\\n\\n  \\u003cscript\\u003e\\n    const COLS = [\\n      { key: 'task', label: 'Task', w: '30%' },\\n      { key: 'owner', label: 'Owner', w: '70px', center: true },\\n      { key: 'status', label: 'Status', w: '15%' },\\n      { key: 'prio', label: 'Priority', w: '12%' },\\n      { key: 'timeline', label: 'Timeline', w: '20%' },\\n      { key: 'date', label: 'Due date', w: '11%' },\\n    ];\\n    const owners = {\\n      JC: '#a25ddc', FG: '#00c875', SM: '#579bfc', LM: '#ff642e', PM: '#e2445c', TK: '#037f4c'\\n    };\\n    const groups = [\\n      { name: 'Configuration', color: '#a25ddc', rows: [\\n        ['Set up legal entities in VMS', 'JC', ['s-done','Done'], ['p-high','High'], [0,28,'#a25ddc'], '5 Jul'],\\n        ['Configure billing & tax rules', 'FG', ['s-work','Working on it'], ['p-high','High'], [12,46,'#a25ddc'], '12 Jul'],\\n        ['Build approval workflows', 'SM', ['s-work','Working on it'], ['p-med','Medium'], [22,60,'#a25ddc'], '18 Jul'],\\n        ['Set up cost centres & GL mapping', 'JC', ['s-none','Not started'], ['p-med','Medium'], [40,72,'#a25ddc'], '24 Jul'],\\n      ]},\\n      { name: 'Integration & Data', color: '#00c875', rows: [\\n        ['Load suppliers into VMS', 'FG', ['s-work','Working on it'], ['p-high','High'], [30,58,'#00c875'], '22 Jul'],\\n        ['Load workers & assignments', 'SM', ['s-none','Not started'], ['p-high','High'], [48,74,'#00c875'], '29 Jul'],\\n        ['Import rate cards', 'TK', ['s-none','Not started'], ['p-med','Medium'], [52,76,'#00c875'], '31 Jul'],\\n        ['Connect Bullhorn VMS integration', 'JC', ['s-stuck','Stuck'], ['p-high','High'], [44,80,'#00c875'], '2 Aug'],\\n      ]},\\n      { name: 'Testing & UAT', color: '#579bfc', rows: [\\n        ['Requisition-to-hire test', 'SM', ['s-none','Not started'], ['p-med','Medium'], [66,86,'#579bfc'], '12 Aug'],\\n        ['Timesheet & invoice test', 'PM', ['s-none','Not started'], ['p-high','High'], [70,90,'#579bfc'], '18 Aug'],\\n        ['Reporting & reconciliation', 'TK', ['s-none','Not started'], ['p-low','Low'], [74,92,'#579bfc'], '22 Aug'],\\n      ]},\\n      { name: 'Go-live', color: '#ff642e', rows: [\\n        ['Cutover plan sign-off', 'JC', ['s-none','Not started'], ['p-high','High'], [88,96,'#ff642e'], '29 Aug'],\\n        ['Go-live — programme live', 'LM', ['s-none','Not started'], ['p-high','High'], [96,100,'#ff642e'], '1 Sep'],\\n      ]},\\n    ];\\n\\n    function colgroup() {\\n      return '\\u003ccolgroup\\u003e' + '\\u003ccol style=\\\"width:6px\\\"\\u003e' + COLS.map(c =\\u003e `\\u003ccol style=\\\"width:${c.w}\\\"\\u003e`).join('') + '\\u003c/colgroup\\u003e';\\n    }\\n    function cell(col, r, color) {\\n      if (col.key === 'task') return `\\u003cdiv class=\\\"cell\\\"\\u003e\\u003cspan class=\\\"check\\\"\\u003e\\u003c/span\\u003e\\u003cspan class=\\\"task\\\"\\u003e${r[0]}\\u003c/span\\u003e\\u003c/div\\u003e`;\\n      if (col.key === 'owner') { const o = r[1]; return `\\u003cdiv class=\\\"cell\\\" style=\\\"justify-content:center\\\"\\u003e\\u003cspan class=\\\"owner\\\" style=\\\"background:${owners[o]}\\\"\\u003e${o}\\u003c/span\\u003e\\u003c/div\\u003e`; }\\n      if (col.key === 'status') { const [cls, lbl] = r[2]; return `\\u003cdiv class=\\\"status ${cls}\\\"\\u003e${lbl}\\u003c/div\\u003e`; }\\n      if (col.key === 'prio') { const [cls, lbl] = r[3]; return `\\u003cdiv class=\\\"prio ${cls}\\\"\\u003e${lbl}\\u003c/div\\u003e`; }\\n      if (col.key === 'timeline') { const [a, b, col2] = r[4]; return `\\u003cdiv class=\\\"timeline\\\"\\u003e\\u003cdiv class=\\\"tl-track\\\"\\u003e\\u003cdiv class=\\\"tl-bar\\\" style=\\\"left:${a}%;width:${b - a}%;background:${col2}\\\"\\u003e\\u003c/div\\u003e\\u003c/div\\u003e\\u003c/div\\u003e`; }\\n      if (col.key === 'date') return `\\u003cdiv class=\\\"cell\\\"\\u003e\\u003cspan class=\\\"date\\\"\\u003e${r[5]}\\u003c/span\\u003e\\u003c/div\\u003e`;\\n      return '';\\n    }\\n    function render() {\\n      const board = document.getElementById('board');\\n      board.innerHTML = groups.map(g =\\u003e {\\n        const head = `\\u003cthead\\u003e\\u003ctr\\u003e\\u003cth style=\\\"border:none;background:none\\\"\\u003e\\u003c/th\\u003e${COLS.map(c =\\u003e `\\u003cth${c.center ? ' class=\\\"center\\\"' : ''}\\u003e${c.label}\\u003c/th\\u003e`).join('')}\\u003c/tr\\u003e\\u003c/thead\\u003e`;\\n        const rows = g.rows.map(r =\\u003e {\\n          const tds = COLS.map(c =\\u003e {\\n            const pad = (c.key === 'status' || c.key === 'prio') ? ' class=\\\"status-td\\\"' : '';\\n            return `\\u003ctd${pad}\\u003e${cell(c, r, g.color)}\\u003c/td\\u003e`;\\n          }).join('');\\n          return `\\u003ctr class=\\\"row\\\"\\u003e\\u003ctd style=\\\"background:${g.color}\\\"\\u003e\\u003c/td\\u003e${tds}\\u003c/tr\\u003e`;\\n        }).join('');\\n        return `\\u003cdiv class=\\\"group\\\"\\u003e\\n          \\u003cdiv class=\\\"group-title\\\" style=\\\"color:${g.color}\\\"\\u003e\\u003cspan class=\\\"caret\\\"\\u003e▾\\u003c/span\\u003e ${g.name} \\u003cspan class=\\\"group-count\\\"\\u003e${g.rows.length} items\\u003c/span\\u003e\\u003c/div\\u003e\\n          \\u003ctable\\u003e${colgroup()}${head}\\u003ctbody\\u003e${rows}\\u003c/tbody\\u003e\\u003c/table\\u003e\\n        \\u003c/div\\u003e`;\\n      }).join('');\\n    }\\n    render();\\n  \\u003c/script\\u003e\\n\\u003c/body\\u003e\\n\\u003c/html\\u003e\\n\";\n(function(){\n  var realFetch = window.fetch ? window.fetch.bind(window) : null;\n  window.fetch = function(input, opts){\n    var u = '';\n    try { u = (typeof input === 'string') ? input : (input && input.url) || ''; } catch(e){}\n    if (u.indexOf('Field.dc.html') !== -1) {\n      return Promise.resolve(new Response(window.__FIELD_SRC__, { status:200, headers:{'Content-Type':'text/html'} }));\n    }\n    if (!realFetch) return Promise.reject(new Error('offline'));\n    return realFetch(input, opts);\n  };\n})();\n<\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* =============================================================\n   STRIIVE DESIGN SYSTEM — DESIGN TOKENS\n   Single source of truth for color, type, spacing, radius, shadow.\n   Consumed by every design-system card and both UI kits.\n   ============================================================= */\n\n/* ---------- Fonts ------------------------------------------- */\n/* Single variable font file covers the full weight range (200–800).\n   Supports optical size (opsz) and width (wdth) axes too. */\n@font-face {\n  font-family: 'Bricolage Grotesque';\n  font-weight: 200 800;\n  font-stretch: 75% 125%;\n  font-style: normal;\n  font-display: swap;\n  src: url(\"0ddd99b7-8b50-46a8-8b23-9f9e0be0af6e\") format('truetype-variations'),\n       url(\"0ddd99b7-8b50-46a8-8b23-9f9e0be0af6e\") format('truetype');\n}\n\n:root {\n  /* ---------- Brand ---------------------------------------- */\n  /* Striive identity: warm, human, a little friendly.\n     Primary is a deep, confident green — taken from the brand mark.\n     The brighter #0DBB52 is reserved for the wordmark dots and small accents. */\n  --striive-ink:            #1D1D1B;   /* near-black headlines */\n  --striive-green:          #0B7F34;   /* PRIMARY — buttons, links, focus */\n  --striive-green-hover:    #086428;\n  --striive-green-bright:   #0DBB52;   /* wordmark dots, live indicators */\n  --striive-green-soft:     #E6F4EB;   /* surfaces / tints */\n  --striive-green-tint:     #D0EAD8;   /* hovered chips, sparse highlights */\n  --striive-coral:          #FF6B5A;   /* secondary / illustration accent, use sparingly */\n  --striive-plum:           #523A8A;   /* premium service tier, use sparingly */\n\n  /* Legacy aliases — kept so older files don't break.\n     Never introduce blue or yellow to new work; these are no-ops that\n     remap to the real brand colors. */\n  --striive-blue:         var(--striive-green);\n  --striive-blue-hover:   var(--striive-green-hover);\n  --striive-blue-soft:    var(--striive-green-soft);\n  --striive-mint:         var(--striive-green-tint);\n  --striive-butter:       var(--striive-green-soft);\n\n  /* ---------- Neutrals (warm grey scale) ------------------- */\n  --neutral-00:  #FFFFFF;\n  --neutral-05:  #F7F8FA;   /* = surface-ground, PrimeNG striive-light */\n  --neutral-10:  #F3F0EA;   /* subtle background */\n  --neutral-20:  #E7E2D8;   /* borders light */\n  --neutral-30:  #D1CCBF;   /* borders */\n  --neutral-40:  #A7A192;   /* disabled text */\n  --neutral-60:  #6F6A5D;   /* secondary text */\n  --neutral-80:  #3A3731;   /* body text on light */\n  --neutral-90:  #1D1D1B;   /* headlines */\n\n  /* ---------- Semantic ------------------------------------ */\n  --color-success:        #158A5C;\n  --color-success-soft:   #E3F5EC;\n  --color-warning:        #C98A00;\n  --color-warning-soft:   #FFF4D6;\n  --color-danger:         #C0392B;\n  --color-danger-soft:    #FBE7E4;\n  --color-info:           var(--striive-green);\n  --color-info-soft:      var(--striive-green-soft);\n\n  /* ---------- Surfaces ------------------------------------ */\n  /* ---------- Surfaces ------------------------------------ */\n  /* --surface-ground mirrors PrimeNG's Striive-light theme.\n     It's the page background everywhere — freelancer portal, client portal,\n     SuperStriive desk. Cards and content sit on --surface-card (white). */\n  --surface-ground:       #f7f8fa;\n  --surface-page:         var(--surface-ground);\n  --surface-card:         var(--neutral-00);\n  --surface-sunken:       var(--neutral-10);\n  --surface-border:       var(--neutral-20);\n  --surface-inverse:      var(--striive-ink);\n\n  /* ---------- Typography ---------------------------------- */\n  --font-display: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;\n  --font-body:    'Bricolage Grotesque', system-ui, -apple-system, sans-serif;\n  --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Type scale — mirrors PrimeFlex text-* utilities exactly.\n     Use PrimeFlex classes in templates (text-sm, text-lg, text-2xl…).\n     Use these vars only in custom SCSS where a utility class can't reach. */\n  --fs-xs:        0.75rem;    /* text-xs   · 12px */\n  --fs-sm:        0.875rem;   /* text-sm   · 14px */\n  --fs-base:      1rem;       /* text-base · 16px */\n  --fs-lg:        1.125rem;   /* text-lg   · 18px */\n  --fs-xl:        1.25rem;    /* text-xl   · 20px */\n  --fs-2xl:       1.5rem;     /* text-2xl  · 24px */\n  --fs-3xl:       1.875rem;   /* text-3xl  · 30px */\n  --fs-4xl:       2.25rem;    /* text-4xl  · 36px */\n  --fs-5xl:       3rem;       /* text-5xl  · 48px */\n  --fs-6xl:       3.75rem;    /* text-6xl  · 60px */\n  --fs-7xl:       4.5rem;     /* text-7xl  · 72px */\n\n  --lh-tight:     1.12;\n  --lh-snug:      1.25;\n  --lh-normal:    1.45;\n  --lh-loose:     1.65;\n\n  /* Letter-spacing — Bricolage wants a touch of negative tracking on big display */\n  --ls-display:   -0.02em;\n  --ls-headline:  -0.012em;\n  --ls-body:      0;\n  --ls-caps:      0.08em;\n\n  /* ---------- Spacing (4px grid) -------------------------- */\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   20px;\n  --space-6:   24px;\n  --space-8:   32px;\n  --space-10:  40px;\n  --space-12:  48px;\n  --space-16:  64px;\n  --space-20:  80px;\n  --space-24:  96px;\n\n  /* ---------- Radius -------------------------------------- */\n  --radius-xs:  4px;\n  --radius-sm:  6px;\n  --radius-md:  10px;\n  --radius-lg:  14px;\n  --radius-xl:  20px;\n  --radius-2xl: 28px;\n  --radius-pill: 999px;\n\n  /* ---------- Elevation ----------------------------------- */\n  --shadow-xs:  0 1px 2px rgba(29, 29, 27, 0.04),\n                0 0 0 1px rgba(29, 29, 27, 0.04);\n  --shadow-sm:  0 1px 2px rgba(29, 29, 27, 0.04),\n                0 2px 6px rgba(29, 29, 27, 0.06);\n  --shadow-md:  0 4px 12px rgba(29, 29, 27, 0.08),\n                0 2px 4px rgba(29, 29, 27, 0.04);\n  --shadow-lg:  0 12px 32px rgba(29, 29, 27, 0.12),\n                0 4px 8px rgba(29, 29, 27, 0.06);\n  --shadow-xl:  0 24px 64px rgba(29, 29, 27, 0.18),\n                0 8px 16px rgba(29, 29, 27, 0.08);\n  --shadow-focus: 0 0 0 3px rgba(11, 127, 52, 0.25);\n\n  /* ---------- Motion -------------------------------------- */\n  --ease-out:     cubic-bezier(0.22, 1, 0.36, 1);\n  --ease-in-out:  cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-fast:     120ms;\n  --dur-base:     200ms;\n  --dur-slow:     320ms;\n\n  /* ---------- Focus ring ---------------------------------- */\n  --focus-ring: 0 0 0 3px rgba(11, 127, 52, 0.28);\n}\n\n/* ---------- Base resets for design system pages ---------- */\nhtml { box-sizing: border-box; }\n*, *::before, *::after { box-sizing: inherit; }\n\n/* Form elements don't inherit font by default — force them to match the page. */\nbutton, input, select, textarea, optgroup {\n  font-family: inherit;\n  font-size: inherit;\n  line-height: inherit;\n  color: inherit;\n}\n\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  font-size: var(--fs-base);\n  line-height: var(--lh-normal);\n  color: var(--neutral-80);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\n/* ---------- Shared layout primitives --------------------- */\n.ds-page {\n  max-width: 1240px;\n  margin: 0 auto;\n  padding: var(--space-12) var(--space-8) var(--space-20);\n}\n.ds-page--wide { max-width: 1440px; }\n\n.ds-eyebrow {\n  font-family: var(--font-display);\n  font-size: var(--fs-xs);\n  font-weight: 600;\n  letter-spacing: var(--ls-caps);\n  text-transform: uppercase;\n  color: var(--neutral-60);\n  margin: 0 0 var(--space-2);\n}\n\n.ds-h1 {\n  font-family: var(--font-display);\n  font-size: var(--fs-4xl);\n  font-weight: 700;\n  letter-spacing: var(--ls-display);\n  line-height: var(--lh-tight);\n  color: var(--neutral-90);\n  margin: 0 0 var(--space-3);\n}\n\n.ds-h2 {\n  font-family: var(--font-display);\n  font-size: var(--fs-2xl);\n  font-weight: 600;\n  letter-spacing: var(--ls-headline);\n  line-height: var(--lh-tight);\n  color: var(--neutral-90);\n  margin: 0 0 var(--space-3);\n}\n\n.ds-h3 {\n  font-family: var(--font-display);\n  font-size: var(--fs-xl);\n  font-weight: 600;\n  letter-spacing: var(--ls-headline);\n  line-height: var(--lh-snug);\n  color: var(--neutral-90);\n  margin: 0 0 var(--space-2);\n}\n\n.ds-lede {\n  font-size: var(--fs-base);\n  line-height: var(--lh-normal);\n  color: var(--neutral-60);\n  max-width: 72ch;\n  margin: 0 0 var(--space-8);\n  text-wrap: pretty;\n}\n\n.ds-prose { max-width: 72ch; }\n.ds-prose p { margin: 0 0 var(--space-4); text-wrap: pretty; }\n.ds-prose strong { color: var(--neutral-90); font-weight: 600; }\n.ds-prose code {\n  font-family: var(--font-mono);\n  font-size: 0.92em;\n  background: var(--neutral-10);\n  padding: 2px 6px;\n  border-radius: var(--radius-xs);\n}\n\n.ds-rule {\n  height: 1px;\n  background: var(--neutral-20);\n  border: none;\n  margin: var(--space-12) 0;\n}\n\n/* ---------- Utility card --------------------------------- */\n.ds-card {\n  background: var(--surface-card);\n  border: 1px solid var(--neutral-20);\n  border-radius: var(--radius-lg);\n  padding: var(--space-6);\n}\n\n/* ---------- Table-like two-column definition ------------- */\n.ds-kv {\n  display: grid;\n  grid-template-columns: minmax(140px, 200px) 1fr;\n  gap: var(--space-3) var(--space-6);\n  font-size: var(--fs-sm);\n}\n.ds-kv dt {\n  color: var(--neutral-60);\n  font-weight: 500;\n}\n.ds-kv dd {\n  margin: 0;\n  color: var(--neutral-80);\n}\n\n/* ---------- Do / Don't blocks ---------------------------- */\n.ds-do-dont {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));\n  gap: var(--space-4);\n  margin: var(--space-6) 0;\n}\n.ds-do, .ds-dont {\n  padding: var(--space-5);\n  border-radius: var(--radius-md);\n  border: 1px solid transparent;\n}\n.ds-do {\n  background: var(--color-success-soft);\n  border-color: color-mix(in srgb, var(--color-success) 22%, transparent);\n}\n.ds-dont {\n  background: var(--color-danger-soft);\n  border-color: color-mix(in srgb, var(--color-danger) 22%, transparent);\n}\n.ds-do::before, .ds-dont::before {\n  display: block;\n  font-size: var(--fs-xs);\n  font-weight: 700;\n  letter-spacing: var(--ls-caps);\n  text-transform: uppercase;\n  margin-bottom: var(--space-2);\n}\n.ds-do::before   { content: 'Do';    color: var(--color-success); }\n.ds-dont::before { content: \"Don't\"; color: var(--color-danger); }\n.ds-do p, .ds-dont p { margin: 0; color: var(--neutral-80); font-size: var(--fs-sm); }\n<\u002Fstyle>\n<style>\n  @keyframes cpFade { from { transform:translateY(8px); } to { transform:none; } }\n  input::placeholder, textarea::placeholder { color: var(--neutral-40); }\n  select option { color: var(--neutral-90); }\n  *::-webkit-scrollbar { width:10px; height:10px; }\n  *::-webkit-scrollbar-thumb { background:var(--neutral-30); border-radius:999px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:var(--surface-g -radius:var(--radius-sm);font-size:15px;color:var(--neutral-90);background:#fff;outline:none;font-family:inherit;\" style-focus=\"border-color:var(--striive-green);box-shadow:var(--focus-ring);\">\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:24px;\">\n        <label style=\"font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:var(--neutral-80);\">Password<\u002Flabel>\n        <input type=\"password\" defaultvalue=\"************\" style=\"height:46px;padding:0 14px;border:1px solid var(--neutral-30);border-radius:var(--radius-sm);font-size:15px;color:var(--neutral-90);background:#fff;outline:none;font-family:inherit;\" style-focus=\"border-color:var(--striive-green);box-shadow:var(--focus-ring);\">\n      <\u002Fdiv>\n      <button onclick=\"{{ signIn }}\" style=\"width:100%;height:48px;background:var(--striive-green);color:#fff;border:none;border-radius:var(--radius-pill);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;\" style-hover=\"background:var(--striive-green-hover);\">Sign in to the portal →<\u002Fbutton>\n      <p style=\"font-size:12.5px;color:var(--neutral-60);margin:18px 0 0;\">Invited by Headfirst Sales · 2-factor enabled · secured by Headfirst Global<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"font-size:12px;color:var(--neutral-60);\">© 2026 Headfirst Global · Privacy · Terms<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:radial-gradient(1100px circle at 75% 25%, color-mix(in srgb, var(--striive-green-bright) 22%, transparent), transparent 58%), var(--striive-green);color:#fff;padding:56px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;\">\n    <div style=\"display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;opacity:0.92;\">\n      <span style=\"width:9px;height:9px;border-radius:50%;background:var(--striive-green-bright);box-shadow:0 0 0 4px rgba(255,255,255,0.18);\"><\u font-size:13px;font-weight:700;letter-spacing:0.04em;color:var(--color-warning);background:var(--color-warning-soft);width:78px;text-align:center;padding:3px 0;border-radius:999px;\">VALIDATE<\u002Fspan> Confirm 13 fields pre-filled from your sales record<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--neutral-10);font-size:14px;color:var(--neutral-80);\"><span style=\"font-size:13px;font-weight:700;letter-spacing:0.04em;color:var(--neutral-60);background:var(--neutral-10);width:78px;text-align:center;padding:3px 0;border-radius:999px;\">CAPTURE<\u002Fspan> Complete legal entities, billing, tax &amp; org hierarchy<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--surface-card);border:1px solid var(--neutral-20);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:20px 24px;display:flex;align-items:center;gap:14px;\">\n    <span style=\"width:40px;height:40px;border-radius:10px;background:var(--neutral-10);color:var(--neutral-60);display:grid;place-items:center;font-size:18px;\">↗<\u002Fspan>\n    <div style=\"flex:1;\"><div style=\"font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--neutral-90);\">Get a head start on Readiness <span style=\"font-size:12px;font-weight:600;color:var(--neutral-60);\">· optional<\u002Fspan><\u002Fdiv><div style=\"font-size:13px;color:var(--neutral-60);\">Based on your contract (MSP), you can begin adding suppliers, workers, assignments &amp; rate cards now.<\u002Fdiv><\u002Fdiv>\n    <button onclick=\"{{ goReadiness }}\" style=\"height:40px;padding:0 18px;background:#fff;color:var(--neutral-80);border:1px solid var(--neutral-30);border-radius:var(--radius-pill);font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;\" style-hover=\"background:var(--neutral-05);\">Open Readiness<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ========================= ONBOARDING DATA FORM ======= elow. For every entity you'll complete all four sections — company &amp; legal details, billing, tax and organisational hierarchy.<\u002Fp><\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- ENTITY SELECTOR (only when multiple) -->\n  <sc-if value=\"{{ meYes }}\">\n    <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;\">\n      <span style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--neutral-60);margin-right:2px;\">Legal entity<\u002Fspan>\n      <sc-for list=\"{{ entityTabs }}\" as=\"e\" hint-placeholder-count=\"1\">\n        <button onclick=\"{{ e.onSelect }}\" style=\"{{ e.style }}\"><span style=\"{{ e.dotStyle }}\">{{ e.dot }}<\u002Fspan>{{ e.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <button onclick=\"{{ addEntity }}\" style=\"display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border:1.5px dashed var(--neutral-30);background:none;border-radius:var(--radius-pill);color:var(--striive-green);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;\" style-hover=\"background:var(--striive-green-soft);border-color:var(--striive-green);\">+ Add new legal entity<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:grid;grid-template-columns:236px 1fr;gap:26px;align-items:start;\">\n    <!-- sidebar -->\n    <nav style=\"position:sticky;top:80px;display:flex;flex-direction:column;gap:4px;\">\n      <button onclick=\"{{ selCompany }}\" style=\"{{ navSecCompany }}\"><span style=\"{{ tickCompany }}\">{{ tickCompanyCh }}<\u002Fspan>Company &amp; legal entities<\u002Fbutton>\n      <button onclick=\"{{ selBilling }}\" style=\"{{ navSecBilling }}\"><span style=\"{{ tickBilling }}\">{{ tickBillingCh }}<\u002Fspan>Billing structures<\u002Fbutton>\n      <button onclick=\"{{ selTax }}\" style=\"{{ navSecTax }}\"><span style=\"{{ tickTax }}\">{{ tickTaxCh }}<\u002Fspan>Tax information<\u002Fbutton>\n      <button onclick=\"{{ selOrg }}\" style=\       <div style=\"padding:4px 20px 24px;border-top:1px solid var(--neutral-20);background:var(--neutral-05);\">\n              <sc-for list=\"{{ rec.groups }}\" as=\"g\" hint-placeholder-count=\"2\">\n                <div style=\"font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--neutral-60);margin:20px 0 13px;\">{{ g.name }}<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px;\">\n                  <sc-for list=\"{{ g.fields }}\" as=\"f\" hint-placeholder-count=\"4\"><div style=\"{{ f.wrap }}\"><dc-import name=\"Field\" f=\"{{ f }}\" hint-size=\"100%,84px\"><\u002Fdc-import><\u002Fdiv><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <div style=\"margin-top:24px;padding-top:18px;border-top:1px solid var(--neutral-20);display:flex;justify-content:space-between;align-items:center;\">\n                <button onclick=\"{{ rec.onRemove }}\" style=\"height:38px;padding:0 14px;background:none;color:var(--color-danger);border:1px solid color-mix(in srgb,var(--color-danger) 35%,transparent);border-radius:var(--radius-pill);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;\" style-hover=\"background:var(--color-danger-soft);\">Remove {{ rec.singular }}<\u002Fbutton>\n                <button onclick=\"{{ rec.onToggle }}\" style=\"height:38px;padding:0 16px;background:var(--striive-green);color:#fff;border:none;border-radius:var(--radius-pill);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;\" style-hover=\"background:var(--striive-green-hover);\">Save {{ rec.singular }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ========================= IMPLEMENTATION ========================= -->\n<sc-if value=\"{{ scImpl }}\">\n<div style=\"max-width:920px;margin:0 auto;padding:36px 28px 80px;animation:cpFade .3s var(--ease-out);\">\n  <button onclick=\"{{ goHome }}\" style=\"font-size:13px;color:var(--neutral-60);background:none;border:none;cursor:pointer;padding:0;margin-bottom:18px;\">← Back to journey<\u002Fbutton>\n  <p style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--striive-green);margin:0 0 8px;\">Step 3 of 3<\u002Fp>\n  <h1 style=\"font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-0.02em;color:var(--neutral-90);margin:0 0 10px;\">Client Implementation<\u002Fh1>\n  <p style=\"font-size:15px;color:var(--neutral-60);line-height:1.5;margin:0 0 26px;max-width:64ch;\">Headfirst configures your programme from the validated data, runs testing with you, and brings you live. This step is led by Headfirst — you'll review and sign off at each gate.<\u002Fp>\n\n  <div style=\"background:var(--surface-card);border:1px solid var(--neutral-20);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);padding:22px 26px;margin-bottom:22px;display:flex;align-items:center;gap:18px;\">\n    <div style=\"flex:1;\"><div style=\"font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--neutral-60);margin-bottom:4px;\">Target go-live<\u002Fdiv><div style=\"font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--neutral-90);\">1 September 2026<\u002Fdiv><\u002Fdiv>\n    <div style=\"text-align:right;\"><div style=\"font-size:12px;color:var(--neutral-60);margin-bottom:4px;\">Overall progress<\u002Fdiv><div style=\"font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--striive-green);\">18%<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:relative;padding-left:30px;\">\n    <div style=\"position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:var(--neutral-20);\"><\u002Fdiv>\n    <sc-for list=\"{{ implSteps }}\" as=\"s\" hint-placeholder-count=\"5\">\n      <div style=\"position:relative;margin-bottom:18px;\">\n        <span style=\"{{ s.dot }}\"><\u002Fspan>\n        <div style=\"background:var(--surface-card);border:1px solid var(--neutral-20);border-radius:var(--radius-md);padding:16px 20px;box-shadow:var(--shadow-xs);\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px;\"><h3 style=\"font-family:var(--font-display);font-size:15.5px;font-weight:600;color:var(--neutral-90);margin:0;\">{{ s.title }}<\u002Fh3><span style=\"{{ s.pill }}\">{{ s.status }}<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:13px;color:var(--neutral-60);margin:0;line-height:1.45;\">{{ s.desc }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ========================= FORM LAYOUT VARIATIONS ========================= -->\n<sc-if value=\"{{ scVariations }}\">\n<div style=\"max-width:1120px;margin:0 auto;padding:36px 28px 80px;animation:cpFade .3s var(--ease-out);\">\n  <button onclick=\"{{ goHome }}\" style=\"font-size:13px;color:var(--neutral-60);background:none;border:none;cursor:pointer;padding:0;margin-bottom:18px;\">← Back to journey<\u002Fbutton>\n  <p style=\"font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--striive-green);margin:0 0 8px;\">Design exploration<\u002Fp>\n  <h1 style=\"font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:-0.02em;color:var(--neutral-90);margin:0 0 10px;\">Three ways to lay out the long data forms<\u002Fh1>\n  <p style=\"font-size:15px;color:var(--neutral-60);line-height:1.5;margin:0 0 30px;max-width:70ch;\">The onboarding and readiness forms are long. Here are three layout patterns to compare. Option A is built live in this prototype — open it to click through.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:20px;\">\n    <!-- A: sectioned sidebar -->\n    <div style=\"background:var(--surface-card);border:1.5px solid var(--striive-green);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"padding:16px 18px;border-bottom:1px solid var(--neutral-10);display:flex;align-items:center;justify-content:space-between;\"><span style=\"font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--neutral-90);\">A · Sectioned sidebar<\u002Fspan><span style=\"font-size:10px;font-weight:700;color:var(--striive-green);background:var(--striive-green-soft);padding:3px 9px;border-radius:999px;\">LIVE<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:16px;background:var(--neutral-05);flex:1;\">\n        <div style=\"display:grid;grid-template-columns:70px 1fr;gap:8px;height:152px;\">\n          <div style=\"display:flex;flex-direction:column;gap:5px;\">\n            <div style=\"height:14px;background:var(--striive-green);border-radius:3px;\"><\u002Fdiv>\n            <div style=\"height:14px;background:var(--neutral-20);border-radius:3px;\"><\u002Fdiv>\n            <div style=\"height:14px;background:var(--neutral-20);border-radius:3px;\"><\u002Fdiv>\n            <div style=\"height:14px;background:var(--neutral-20);border-radius:3px;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid var(--neutral-20);border-radius:6px;padding:9px;display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"height:8px;width:50%;background:var(--neutral-30);border-radius:2px;\"><\u002Fdiv>\n            <div style=\"height:13px;background:var(--neutral-10);border:1px solid var(--neutral-20);border-radius:3px;\"><\u002Fdiv>\n            <div style=\"height:13px;background:var(--neutral-10);border:1px solid var(--neutral-20);border-radius:3px;\"><\u002Fdiv>\n            <div style=\"height:13px;background:var(--neutral-10);border:1px solid var(--neutral-20);border-radius:3px;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;\"><p style=\"font-size:12.5px;color:var(--neutral-60);line-height:1.45;margin:0 0 14px;\">Jump between categories from a sticky sidebar; one section on screen at a time. Best for dense data with clear groups. <strong style=\"color:var(--neutral-90);font-weight:600;\">Chosen for this build.<\u002Fstrong><\u002Fp><button onclick=\"{{ goForm }}\" style=\"width:100%;height:40px;background:var(--striive-green);color:#fff;border:none;border-radius:var(--radius-pill);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;\" style-hover=\"background:var(--striive-green-hover);\">Open live form →<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- B: wizard -->\n    <div style=\"background:var(--surface-card);border:1px solid var(--neutral-20);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"padding:16px 18px;border-bottom:1px solid var(--neutral-10);\"><span style=\"font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--neutral-90);\">B · Step-by-step wizard<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:16px;background:var(--neutral-05);flex:1;\">\n        <div style=\"background:#fff;border:1px solid var(--neutral-20);border-radius:6px;padding:12px;height:152px;display:flex;flex-direction:column;\">\n          <div style=\"display:flex;gap:5px;margin-bottom:12px;\"><div style=\"height:5px;flex:1;background:var(--striive-green);border-radius:2px;\"><\u002Fdiv><div style=\"height:5px;flex:1;background:var(--striive-green);border-radius:2px;\"><\u002Fdiv><div style=\"height:5px;flex:1;background:var(--neutral-20);border-radius:2px;\"><\u002Fdiv><div style=\"height:5px;flex:1;background:var(--neutral-20);border-radius:2px;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"height:8px;width:40%;background:var(--neutral-30);border-radius:2px;margin-bottom:10px;\"><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:7px;flex:1;\"><div style=\"height:14px;background:var(--neutral-10);border:1px solid var(--neutral-20);border-radius:3px;\"><\u002Fdiv><div style=\"height:14px;background:var(--neutral-10);border:1px solid var(--neutral-20);border-radius:3px;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;\"><div style=\"height:16px;width:36px;background:var(--neutral-20);border-radius:999px;\"><\u002Fdiv><div style=\"height:16px;width:44px;background:var(--striive-green);border-radius:999px;\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;\"><p style=\"font-size:12.5px;color:var(--neutral-60);line-height:1.45;margin:0;\">One question-group per step with Back/Next and a progress bar. Friendliest for first-timers, but slower to scan or revisit a single field.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- C: single long page -->\n    <div style=\"background:var(--surface-card);border:1px solid var(--neutral-20);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs);overflow:hidden;display:flex;flex-direction:column;\">\n      <div style=\"padding:16px 18px;border-bottom:1px solid var(--neutral-10);\"><span style=\"font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--neutral-90);\">C · One long page<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:16px;background:var(--neutral-05);flex:1;\">\n        <div style=\"background:#fff;border:1px solid var(--neutral-20);border-radius:6px;padding:12px;height:152px;display:flex;flex-direction:column;gap:7px;overflow:hidden;\">\n          <div style=\"height:8px;width:45%;background:var(--neutral-30);border-radius:2px;\"><\u002Fdiv>\n          <div style=\"height:12px;background:var(--neutral-10);border:1px solid var(--neutral-20);border-radius:3px;\"><\u002Fdiv>\n          <div style=\"height:12px;background:var(--neutral-10);border:1px solid var(--neutral-20);border-radius:3px;\"><\u002Fdiv>\n          <div style=\"height:8px;width:38%;background:var(--neutral-30);border-radius:2px;margin-top:4px;\"><\u002Fdiv>\n          <div style=\"height:12px;background:var(--neutral-10);border:1px solid var(--neutral-20);border-radius:3px;\"><\u002Fdiv>\n          <div style=\"height:12px;background:var(--neutral-10);border:1px solid var(--neutral-20);border-radius:3px;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:16px 18px;\"><p style=\"font-size:12.5px;color:var(--neutral-60);line-height:1.45;margin:0;\">Everything on one scrolling page, grouped by heading. Fast for power users and great for review, but daunting on first open.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ========================= MODALS ========================= -->\n<sc-if value=\"{{ modalOpen }}\">\n<div onclick=\"{{ closeModal }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(29,29,27,0.5);display:flex;align-items:center;justify-content:center;padding:24px;animation:cpFade .18s var(--ease-out);\">\n\n  <sc-if value=\"{{ modalInvite }}\">\n  <div onclick=\"{{ stopProp }}\" style=\"background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-xl);width:100%;max-width:540px;max-height:90vh;overflow:auto;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;padding:22px 24px 0;\">\n      <div><h2 style=\"font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--neutral-90);margin:0 0 3px;\">Invite a colleague<\u002Fh2><p style=\"font-size:13px;color:var(--neutral-60);margin:0;\">They'll get portal access scoped to their area.<\u002Fp><\u002Fdiv>\n      <button onclick=\"{{ closeModal }}\" style=\"width:32px;height:32px;border-radius:8px;border:none;background:var(--neutral-10);color:var(--neutral-60);font-size:17px;cursor:pointer;flex:0 0 auto;\" style-hover=\"background:var(--neutral-20);\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"padding:22px 24px;display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;\"><label style=\"font-size:12.5px;font-weight:600;color:var(--neutral-80);\">First name <span style=\"color:var(--color-danger);\">*<\u002Fspan><\u002Flabel><input value=\"{{ invFirst }}\" onchange=\"{{ onInvFirst }}\" placeholder=\"Anika\" style=\"height:42px;padding:0 13px;border:1px solid var(--neutral-30);border-radius:var(--radius-sm);font-size:14px;color:var(--neutral-90);background:#fff;outline:none;font-family:inherit;\" style-focus=\"border-color:var(--striive-green);box-shadow:var(--focus-ring);\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;\"><label style=\"font-size:12.5px;font-weight:600;color:var(--neutral-80);\">Last name<\u002Flabel><input value=\"{{ invLast }}\" onchange=\"{{ onInvLast }}\" placeholder=\"Visser\" style=\"height:42px;padding:0 13px;border:1px solid var(--neutral-30);border-radius:var(--radius-sm);font-size:14px;color:var(--neutral-90);background:#fff;outline:none;font-family:inherit;\" style-focus=\"border-color:var(--striive-green);box-shadow:var(--focus-ring);\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;grid-column:1 / -1;\"><label style=\"font-size:12.5px;font-weight:600;color:var(--neutral-80);\">Work email <span style=\"color:var(--color-danger);\">*<\u002Fspan><\u002Flabel><input type=\"email\" value=\"{{ invEmail }}\" onchange=\"{{ onInvEmail }}\" placeholder=\"anika.visser@liander.nl\" style=\"height:42px;padding:0 13px;border:1px solid var(--neutral-30);border-radius:var(--radius-sm);font-size:14px;color:var(--neutral-90);background:#fff;outline:none;font-family:inherit;\" style-focus=\"border-color:var(--striive-green);box-shadow:var(--focus-ring);\"><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;\"><label style=\"font-size:12.5px;font-weight:600;color:var(--neutral-80);\">Department<\u002Flabel><select value=\"{{ invDept }}\" onchange=\"{{ onInvDept }}\" style=\"height:42px;padding:0 13px;border:1px solid var(--neutral-30);border-radius:var(--radius-sm);font-size:14px;color:var(--neutral-90);background:#fff;outline:none;font-family:inherit;cursor:pointer;\" style-focus=\"border-color:var(--striive-green);box-shadow:var(--focus-ring);\"><option value=\"\">Select…<\u002Foption><sc-for list=\"{{ deptOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fselect><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;\"><label style=\"font-size:12.5px;font-weight:600;color:var(--neutral-80);\">Country<\u002Flabel><select value=\"{{ invCountry }}\" onchange=\"{{ onInvCountry }}\" style=\"height:42px;padding:0 13px;border:1px solid var(--neutral-30);border-radius:var(--radius-sm);font-size:14px;color:var(--neutral-90);background:#fff;outline:none;font-family:inherit;cursor:pointer;\" style-focus=\"border-color:var(--striive-green);box-shadow:var(--focus-ring);\"><option value=\"\">Select…<\u002Foption><sc-for list=\"{{ countryOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o }}\">{{ o }}<\u002Foption><\u002Fsc-for><\u002Fselect><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px 22px;\">\n      <span style=\"font-size:12px;color:var(--neutral-60);\">First name &amp; email required<\u002Fspan>\n      <div style=\"display:flex;gap:10px;\">\n        <button onclick=\"{{ closeModal }}\" style=\"height:42px;padding:0 18px;background:#fff;color:var(--neutral-80);border:1px solid var(--neutral-30);border-radius:var(--radius-pill);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;\">Cancel<\u002Fbutton>\n        <button onclick=\"{{ sendInvite }}\" style=\"height:42px;padding:0 20px;background:var(--striive-green);color:#fff;border:none;border-radius:var(--radius-pil
