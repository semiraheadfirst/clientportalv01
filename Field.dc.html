<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:6px;width:100%;">
  <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-height:18px;">
    <span style="font-size:12.5px;font-weight:600;color:var(--neutral-80);line-height:1.3;">{{ f.l }}</span>
    <sc-if value="{{ f.req }}" hint-placeholder-val="{{ true }}"><span style="color:var(--color-danger);font-weight:700;font-size:13px;">*</span></sc-if>
    <sc-if value="{{ f.bValidate }}"><span style="font-size:10.5px;font-weight:700;letter-spacing:0.02em;color:var(--color-warning);background:var(--color-warning-soft);padding:2px 8px;border-radius:999px;white-space:nowrap;">⬤ To validate</span></sc-if>
    <sc-if value="{{ f.bConfirmed }}"><span style="font-size:10.5px;font-weight:700;letter-spacing:0.02em;color:var(--color-success);background:var(--color-success-soft);padding:2px 8px;border-radius:999px;white-space:nowrap;">✓ Confirmed</span></sc-if>
  </div>
  <sc-if value="{{ f.isIn }}">
    <div style="position:relative;display:flex;align-items:center;">
      <sc-if value="{{ f.hasPrefix }}"><span style="position:absolute;left:12px;font-size:14px;color:var(--neutral-60);font-weight:500;pointer-events:none;">{{ f.prefix }}</span></sc-if>
      <input type="{{ f.t }}" placeholder="{{ f.p }}" defaultValue="{{ f.v }}" onChange="{{ f.onChange }}" style="{{ f.inStyle }}" style-focus="border-color:var(--striive-green);box-shadow:var(--focus-ring);" />
    </div>
  </sc-if>
  <sc-if value="{{ f.isSel }}">
    <select defaultValue="{{ f.v }}" onChange="{{ f.onChange }}" style="height:42px;padding:0 36px 0 13px;border:1px solid var(--neutral-30);border-radius:var(--radius-sm);background:var(--surface-card) url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2214%22 height=%2214%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%236F6A5D%22 stroke-width=%222.2%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><polyline points=%226 9 12 15 18 9%22/></svg>') no-repeat right 11px center;font-size:14px;font-family:inherit;color:var(--neutral-90);outline:none;width:100%;appearance:none;-webkit-appearance:none;cursor:pointer;" style-focus="border-color:var(--striive-green);box-shadow:var(--focus-ring);">
      <option value="">Select…</option>
      <sc-for list="{{ f.o }}" as="opt" hint-placeholder-count="3"><option value="{{ opt }}">{{ opt }}</option></sc-for>
    </select>
  </sc-if>
  <sc-if value="{{ f.isTa }}">
    <textarea placeholder="{{ f.p }}" defaultValue="{{ f.v }}" rows="2" style="padding:10px 13px;border:1px solid var(--neutral-30);border-radius:var(--radius-sm);background:var(--surface-card);font-size:14px;font-family:inherit;color:var(--neutral-90);outline:none;width:100%;resize:vertical;line-height:1.4;" style-focus="border-color:var(--striive-green);box-shadow:var(--focus-ring);"></textarea>
  </sc-if>
  <sc-if value="{{ f.hasHelp }}"><span style="font-size:11.5px;color:var(--neutral-60);line-height:1.35;">{{ f.h }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:90},&quot;f&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;l&quot;:&quot;Field label&quot;,&quot;isIn&quot;:true,&quot;t&quot;:&quot;text&quot;,&quot;v&quot;:&quot;&quot;,&quot;p&quot;:&quot;Placeholder&quot;,&quot;inStyle&quot;:&quot;height:42px;padding:0 13px;border:1px solid var(--neutral-30);border-radius:var(--radius-sm);background:var(--surface-card);font-size:14px;color:var(--neutral-90);outline:none;width:100%;&quot;}}}"></script>
</body>
</html>
